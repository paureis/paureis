# Keeps the profile current: the pau-skills counts in README.md, and the animated contribution graph.
# The repo is public, so these runs don't use the account's Actions minutes.
name: profile

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  # Preview only: lets the readme-december branch try the workflow. Remove before merging to main.
  push:
    branches: [readme-december]

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: node --test scripts/update-stats.test.mjs
      - run: node scripts/update-stats.mjs
      - name: Commit if the numbers changed
        run: |
          if git diff --quiet README.md; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the pau-skills counts in README.md"
          git push

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
