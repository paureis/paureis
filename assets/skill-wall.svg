<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 604" width="1000" height="604" role="img" aria-labelledby="t d">
  <title id="t">The 42 skills in pau-skills</title>
  <desc id="d">42 skills in five groups: know what to build, prove it works, run many agents, stay safe, keep improving. The ones used most: session-close, safe-merge, lean-subagent-dev, parallel-worktrees.</desc>
